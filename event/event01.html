<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>event</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
      }
      .box.active{
        width: 500px;
        height: 500px;
        background-color: yellow;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <!-- 1.이벤트 연결 -->
    <button id="btn">눌러보세요</button>
    <!-- 2.입력 이벤트 -->
    <input type="text" id="inputName" placeholder="이름을 입력하세요" />
    <!-- 3.form 제출 이벤트 -->
    <form id="myForm">
      <input id="userEmail" type="text" placeholder="이메일을 입력하세요." />
      <button type="submit">제출</button>
    </form>
    <!-- 4.마우스 이벤트 -->
    <div class="box"></div>
    <!-- 5.키보드 이벤트 -->
    <input type="text" id="keyInput" placeholder="아무 키나 눌러보세요" />
    <script>
      const btn = document.querySelector("#btn");
      btn.addEventListener("click", () => {
        console.log("click");
        btn.style.color = "red";
      });
      //   입력이벤트
      const userName = document.querySelector("#inputName");
      console.log(userName);
      userName.addEventListener("input", () => {
        console.log(userName.value);
      });
      //   form의 제출 이벤트
      const form = document.querySelector("#myForm");
      const userEmail = document.querySelector("#userEmail");
      form.addEventListener("submit", (event) => {
        console.log(event);
        // 원래 행동을 막아 주는 매서드
        event.preventDefault();
        console.log("폼이 제출 되었습니다.");
        console.log(userEmail.value);
        document.write(`${userEmail.value}`);
      });
      // 마우스 이벤트
      const box = document.querySelector(".box");
      box.addEventListener("mouseover", () => {
        box.style.backgroundColor = "orange";
      });
      box.addEventListener("mouseout", () => {
        box.style.backgroundColor = "aquamarine";
      });
      //키보드 이벤트
      const keyInput = document.querySelector("#keyInput");
      keyInput.addEventListener("keydown", (event) => {
        console.log(event.key);
        console.log(event.keyCode);
      });
      // 페이지 로드 이벤트
      window.addEventListener("load", () => {
        console.log("페이지 로딩 완료!!");
      });
      // 화면 리사이즈 이벤트
      window.addEventListener("resize",()=>{
        // 화면의 사이즈가 600px보다 작으면
        if(window.innerWidth < 600){
          box.classList.add("active");
        }else{
          box.classList.remove("active");
        }
      })
      // console.log(window.innerWidth);//화면의 가로사이즈 출력
      // console.log(window.innerHeight);//화면의 높이사이즈 출력
      
      
    </script>
  </body>
</html>
