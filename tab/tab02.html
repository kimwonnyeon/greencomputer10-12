<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ul,
      li {
        list-style: none;
      }
      .menu {
        width: 50%;
        max-width: 600px;
        display: flex;
        margin: 50px auto;
        background-color: antiquewhite;
      }
      .menu-item {
        flex: 1;
        text-align: center;
        padding: 10px;
        transition: all 0.3s;
      }
      .menu-item:hover,
      .menu-item.active {
        background-color: rgb(252, 182, 90);
        cursor: pointer;
      }
      .card-container {
        width: 60%;
        max-width: 700px;
        margin: auto;
      }
      .card {
        display: none;
        gap: 20px;
        border: 1px solid #ccc;
      }
      .card.active {
        display: flex;
      }
      .card li {
        flex: 1;
      }
      .card img {
        width: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 탭 메뉴 -->
    <div class="menu" id="menu">
      <!-- js 출력 -->
    </div>
    <!-- 카드 영역 -->
    <div class="card-container" id="cardContainer">
      <!-- js출력 -->
    </div>
    <script>
      //더미 데이터
      const menuData = [
        {
          title: "메뉴 1",
          product: [
            { image: "images/frame1.png", name: "아메카노", price: 6000 },
            { image: "images/frame2.png", name: "카페라떼", price: 6500 },
            { image: "images/frame3.png", name: "바닐라라떼", price: 7000 },
          ],
        },
        {
          title: "메뉴 2",
          product: [
            { image: "images/frame3.png", name: "카페라떼", price: 6500 },
            { image: "images/frame4.png", name: "초콜릿", price: 5000 },
            { image: "images/frame1.png", name: "아메카노", price: 6000 },
          ],
        },
        {
          title: "메뉴 3",
          product: [
            { image: "images/frame5.png", name: "카페라떼", price: 6500 },
            { image: "images/frame3.png", name: "초콜릿", price: 5000 },
            { image: "images/frame2.png", name: "아메카노", price: 6000 },
          ],
        },
      ];
      //html 요소 가져오기
      const menu = document.querySelector("#menu");
      const cardContainer = document.querySelector("#cardContainer");
      //   탭 메뉴 만들기
      // menu.innerHTML = menuDate.map().join("")
      menu.innerHTML = menuData
        .map((item, index) => {
          // console.log(item,index);
          return `<div class="menu-item ${index === 0 ? "active" : ""}">${item.title}</div>`;
        })
        .join("");
      // 탭 내용
      cardContainer.innerHTML = menuData
        .map((item, index) => {
          return `
          <ul class="card ${index === 0 ? "active" : ""}" }>
            ${item.product
              .map((product, index) => {
                return `<li>
            <img src="${product.image}" alt="">
            <h2>${product.name}</h2>
            <p>가격:${product.price.toLocaleString()}원</p>
            </li>`;
              })
              .join("")}
       </ul>
        `;
        })
        .join("");
      // 생성된 탭 메뉴와 탭 내용 가져오기
      const menuItems = document.querySelectorAll(".menu-item");
      const cards = document.querySelectorAll(".card");
      //   console.log(menuItems);
      //   console.log(cards);
      //   탭에 맞는 카드 보여주는 함수
      function showCard(index) {
        // console.log(index);
        // 모든 탭 active 제거
        // 모든 탭내용 active 제거
        menuItems.forEach((item)=>{
            item.classList.remove("active");

        })
        cards.forEach((card)=>{
            card.classList.remove("active");
        })
        // 클릭한 탭과 같은 번호의 카드 활성화
        menuItems[index].classList.add("active");
        cards[index].classList.add("active");
      }
      // 탭 메뉴 클릭시
      menuItems.forEach((item, index) => {
        // console.log(item,index);
        item.addEventListener("click", () => {
          showCard(index);
        });
      });
    </script>
  </body>
</html>
