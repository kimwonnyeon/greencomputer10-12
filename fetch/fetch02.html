<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="result">
      <!-- js출력 -->
    </div>
    <script>
      fetch("data/product.json")
        .then((res) => {
          // console.log(res);
          return res.json();
        })
        .then((data) => {
        //   console.log(data);
          const htmlEl = data
            .map((item) => {
              return `
            <div class="card">
            <h3>상품명 : ${item.name} </h3>
            <p>가격 : ${item.price} </p>
         </div>`;
            })
            .join("");
          const result = document.querySelector("#result");
          result.innerHTML = htmlEl;
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
