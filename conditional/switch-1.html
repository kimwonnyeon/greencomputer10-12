<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조건문-switch</title>
  </head>
  <body>
    <script>
      // switch(조건){
      //     case 값1  : 명령1;
      //     break
      //     case 값2: 명령2;
      //     break
      //     case 값3: 명령3;
      //     break
      //     .....
      //     defalut :명령 n;
      // }
      let score = prompt("점수를 입력하세요");
      //   console.log(score);
      //변수 선언
      let grade;
      switch (true) {
        case score >= 90:
          grade = "A학점";
          break;
        case score >= 80:
          grade = "B학점";
          break;
        case score >= 70:
          grade = "C학점";
          break;
        case score >= 60:
          grade = "D학점";
          break;
        default:
          grade = "F학점";
      }
      document.write(`당신의 학점은 : ${grade}`,"_self");
    </script>
  </body>
</html>
