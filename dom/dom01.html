<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dom - 요소생성</title>
  </head>
  <body>
    <div id="container">
      <h1>웹 프로그래밍</h1>
      <!-- p태그 생성 -->
      <!-- js생성 -->
    </div>
    <div class="notice">
      <!-- span안에 글자 안녕하세요. -->
      <!-- js생성 -->
    </div>
    <script>
      // p태그 생성
      //   createElement():요소 생성 매서드
      const newP = document.createElement("p"); //태그를 생성
      console.log(newP);
      //   createTextNode(): 글자요소 생성 매서드
      const txtNode = document.createTextNode(
        "DOM은 document object model의 줄임말이다.",
      ); //글자요소 생성
      console.log(txtNode);
      //   p태그에 글자를 넣는다.
      //   appendChild(): 자식요소를 더하는 매서드
      newP.appendChild(txtNode); //자식을 더해라
      console.log(newP);
      // container영역 안에 p태그 연결
      document.querySelector("#container").appendChild(newP);
      const newSpan = document.createElement("span");
      const textNode = document.createTextNode("안녕하세요.");
      newSpan.appendChild(textNode);
      document.querySelector(".notice").appendChild(newSpan);
    </script>
  </body>
</html>
