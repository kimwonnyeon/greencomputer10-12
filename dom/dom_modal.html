<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dom-modal</title>
    <style>
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        /* display: flex; */
        display: none;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        position: relative;
        width: 300px;
        padding: 30px;
        border-radius: 20px;
        background-color: #fff;
      }
      /* 닫기 버튼 */
      .close-Btn {
        position: absolute;
        top: -26px;
        right: 16px;
        cursor: pointer;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- 모달창 -->
    <!-- 모달 열기 버튼 -->
    <button class="openBtn">모달 열기</button>
    <!-- 모달창 -->
    <div class="modal">
      <!-- 모달 내용 -->
      <div class="modal-content">
        <span class="close-Btn">X</span>
        <h2>모달창</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque magnam
          dolores soluta fugiat, voluptatum explicabo repellat deserunt saepe
          veritatis. Molestias, cumque alias. Qui eaque molestias nesciunt ipsam
          deleniti veniam. Error!
        </p>
      </div>
    </div>
    <script>
      const openBtn = document.querySelector(".openBtn");
      const modal = document.querySelector(".modal");
      const closeBtn = document.querySelector(".close-Btn");
      //   모달 열기
      openBtn.addEventListener("click", () => {
        modal.style.display = "flex";
      });
      // 모달 닫기
      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
      });
      // 배경 클릭시 닫기
      modal.addEventListener("click", (e) => {
        console.log(e);
        // e.target.style.display = "none";
        if (e.target === modal) {
          e.target.style.display = "none";
        }
      });
    </script>
  </body>
</html>
