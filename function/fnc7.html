<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수예제7</title>
    <style>
      .submenu {
        display: none;
      }
      .submenu.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <button class="menu">메뉴1</button>
    <ul class="submenu">
      <li>서브 메뉴 1</li>
      <li>서브 메뉴 2</li>
    </ul>
    <script>
      const menu = document.querySelector(".menu");
      const submenu = document.querySelector(".submenu");
      menu.addEventListener("click", () => {
        submenu.classList.toggle("active");
      });
    </script>
  </body>
</html>
