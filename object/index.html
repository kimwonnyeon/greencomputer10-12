<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>객체</title>
  </head>
  <body>
    <!-- 객체:여러가지 정보를 하나로 묶어 놓은것 -->
    <!-- 내장 객체: 자바스크립트가 미리 만들어 놓은 객체 -->
    <!-- Date,Array,String,Math -->
    <script>
      // String
      const str = "Hello world";
      console.log(str);
      console.log(str.length); //문자의 길이를 알수 있는 속성
      console.log(str.toUpperCase); //대문자로 바꿔주는 메서드
      console.log(str.includes("world")); //문자열에 해당 문자가 있는지 참,거짓으로 확인 하는 메서드
      //Array
      const arr = [1, 2, 3, 4];
      console.log(arr);
      console.log(arr.length); // 배열 길이
      console.log(arr.push(5)); //배열안에 값 넣기
      console.log(arr);//[1,2,3,4,5]
      console.log(arr.join("/")); //출력값:1/2/3/4/5
      //Date
      const today = new Date();
      console.log(today);
      console.log(today.getMonth()+1);//현재 날짜 (월 0 부터 출력하기때문에 +1)
      console.log(today.toDateString());//Wed Oct 14 2026
      console.log(today.toLocaleDateString());//2026. 10. 14.
      console.log(today.getFullYear());//2026
      //Math
      console.log(Math.PI);//3.141592653589793
      console.log(Math.max(10,24,100,50));//100
      console.log(Math.min(10,24,100,50));//10
      console.log(Math.random());//0~1 사이 난수
      
    </script>
  </body>
</html>
