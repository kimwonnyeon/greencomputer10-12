<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String 객체</title>
  </head>
  <body>
    <script>
      //length 속성
      const str = "Hello, JavaScript";
      console.log(str.length); //길이
      //toUpperCase() toLowerCase() 메서드
      console.log(str.toLowerCase()); //소문자 변환
      console.log(str.toUpperCase()); //대문자 변환
      //includes() 해당내용이 있는지 확인 메서드
      const email = "user@example.com";
      console.log(email.includes("@"));
      //trim() 공백제거 메서드
      const input = " he llo";
      console.log(input.length);
      console.log(input.trim().length);
      //slice():시작인덱스(포함), 끝인덱스(미포함,바로 앞까지만 자름)
      const str2 = "JavaScript";
      console.log(str2.slice(4, 10));
      //replace():문자 교체
      const sentence = "I Like Java";
      console.log(sentence.replace("Java", "JavaScript"));
      //split():문자 분리
      const data = "apple,banna,orange";
      console.log(data.split(""));
    </script>
  </body>
</html>
