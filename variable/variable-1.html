<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 1</title>
  </head>
  <body>
    <script>
      // 변수 공부
      // 변수: 데이터를 담는 상자
      // 변수 선언과 할당
      let name = "김어";
      console.log(name);
      // name변수에 재할당
      name = "김미";
      console.log(name);
      // const 재할당 불가
      const age = 20;
      console.log(age);
      // age=30;
      console.log(age); //오류

      let userName = prompt("이름을 입력하세요.", "ㅇㅇㅇ");
      console.log(userName);
      document.write(`<h1>이름: ${userName}</h1>
    <p>나이 : ${age}</p>`);
    </script>
  </body>
</html>
